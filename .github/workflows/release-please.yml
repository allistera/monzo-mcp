name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dxt:
    name: Build and attach DXT bundle
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install (with dev deps)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Stage DXT bundle
        run: |
          mkdir -p .dxt-build
          cp manifest.json package.json README.md LICENSE .dxt-build/
          cp -R dist node_modules .dxt-build/

      - name: Package DXT
        run: |
          cd .dxt-build
          zip -r "../monzo-mcp-${{ needs.release-please.outputs.tag_name }}.dxt" .

      - name: Upload DXT artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dxt-${{ needs.release-please.outputs.tag_name }}
          path: monzo-mcp-${{ needs.release-please.outputs.tag_name }}.dxt
          if-no-files-found: error

  attach-dxt:
    name: Attach DXT bundle to release
    needs: [release-please, dxt]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DXT artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dxt-${{ needs.release-please.outputs.tag_name }}

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "monzo-mcp-${{ needs.release-please.outputs.tag_name }}.dxt" \
            --repo "${{ github.repository }}" --clobber
